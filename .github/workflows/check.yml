name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: scripts/check.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save fast-check@4.5.3
      - run: |
          ls p3stack/skills/*/scripts/test/*.test.ts >/dev/null
          node --disable-warning=ExperimentalWarning --test p3stack/skills/*/scripts/test/*.test.ts
      - uses: oven-sh/setup-bun@v2
      - working-directory: p3stack/skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun test orch watch-pr check-plan.test.ts
