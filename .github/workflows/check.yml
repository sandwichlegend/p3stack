name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: scripts/check.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test p3stack/skills/*/scripts/test/*.test.mjs
      - run: |
          export HOME=$(mktemp -d /tmp/p3stack-ci.XXXXXXXX)
          export CLAUDE_CONFIG_DIR=$HOME/.claude CODEX_HOME=$HOME/.codex
          export XDG_CONFIG_HOME=$HOME/.config XDG_DATA_HOME=$HOME/.local/share
          export XDG_CACHE_HOME=$HOME/.cache XDG_STATE_HOME=$HOME/.local/state
          bash scripts/test-update/test.sh
      - uses: oven-sh/setup-bun@v2
      - working-directory: p3stack/skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun test orch watch-pr check-plan.test.ts
